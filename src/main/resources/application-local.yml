spring:
  application:
    name: fhs-ai-agent
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${DASHSCOPE_CHAT_MODEL:qwen-turbo}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_CHAT_MODEL:gemma3:1b}
  # PostgreSQL is optional in the local profile. Configure these variables
  # only when the datasource-backed path is enabled.
  # datasource:
  #   url: ${SPRING_DATASOURCE_URL:}
  #   username: ${SPRING_DATASOURCE_USERNAME:}
  #   password: ${SPRING_DATASOURCE_PASSWORD:}
  #   driver-class-name: org.postgresql.Driver

search-api:
  api-key: ${SEARCH_API_KEY:}
