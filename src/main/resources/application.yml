spring:
  application:
    name: fhs-ai-agent
  profiles:
    active: local
  ai:
    dashscope:
      # 单次模型调用最长等待时间，避免 Agent 多阶段调用无限挂起。
      read-timeout: ${DASHSCOPE_READ_TIMEOUT_SECONDS:30}
    retry:
      max-attempts: ${SPRING_AI_RETRY_MAX_ATTEMPTS:2}

#    vectorstore:
#      pgvector:
#        index-type: HNSW
#        distance-type: COSINE_DISTANCE
#        max-document-batch-size: 10000
    mcp:
      client:
        sse:
          connections:
            server1:
              url: http://localhost:8127
#        stdio:
#          servers-configuration: classpath:mcp-servers.json
server:
    port: 8123
    servlet:
      context-path: /api

# springdoc-openapi?
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.fhs.aiagent.controller
# knife4j???????????????
knife4j:
  enable: true
  setting:
    language: zh_cn
#修改日志级别，查看Spring AI 更多调用
logging:
  level:
    org.springframework.ai: DEBUG

agent:
  rag:
    vector-cache-enabled: ${AGENT_RAG_VECTOR_CACHE_ENABLED:true}
    vector-cache-directory: ${AGENT_RAG_VECTOR_CACHE_DIRECTORY:tmp/rag/vector-store}
    # 文档增强策略或 Embedding 模型变化时递增此版本，以强制重建索引。
    vector-cache-version: ${AGENT_RAG_VECTOR_CACHE_VERSION:v1}
    retrieval:
      min-top-k: ${AGENT_RAG_MIN_TOP_K:3}
      max-top-k: ${AGENT_RAG_MAX_TOP_K:6}
      similarity-threshold: ${AGENT_RAG_SIMILARITY_THRESHOLD:0.2}
    multi-agent:
      enabled: ${AGENT_RAG_MULTI_AGENT_ENABLED:true}
      # 检测到至少两个独立能力域时才启用并行 Agent，简单问题保留快速路径。
      minimum-domains: ${AGENT_RAG_MULTI_AGENT_MINIMUM_DOMAINS:2}
      max-agents: ${AGENT_RAG_MULTI_AGENT_MAX_AGENTS:3}
      # 每个专业 Agent 的总执行预算与局部容错；全部失败时仍会降级到单 Agent。
      specialist-max-attempts: ${AGENT_RAG_SPECIALIST_MAX_ATTEMPTS:2}
      specialist-timeout-seconds: ${AGENT_RAG_SPECIALIST_TIMEOUT_SECONDS:35}
      circuit-breaker-failure-threshold: ${AGENT_RAG_CIRCUIT_BREAKER_FAILURE_THRESHOLD:3}
      circuit-breaker-cooldown-seconds: ${AGENT_RAG_CIRCUIT_BREAKER_COOLDOWN_SECONDS:60}
    runtime:
      # 保存运行请求、阶段事件和最终结果，支持重启后的状态查询与显式恢复。
      storage-directory: ${AGENT_RAG_RUNTIME_STORAGE_DIRECTORY:tmp/agent-runs}
      maximum-events: ${AGENT_RAG_RUNTIME_MAXIMUM_EVENTS:200}
    routing-policy:
      # 冷启动时保持确定性路由；单/多 Agent 样本都充足后才允许学习策略覆盖。
      enabled: ${AGENT_RAG_ROUTING_POLICY_ENABLED:true}
      mode: ${AGENT_RAG_ROUTING_POLICY_MODE:SHADOW}
      canary-rate: ${AGENT_RAG_ROUTING_CANARY_RATE:0.1}
      minimum-canary-samples: ${AGENT_RAG_ROUTING_MINIMUM_CANARY_SAMPLES:20}
      maximum-deployment-history: ${AGENT_RAG_ROUTING_MAXIMUM_DEPLOYMENT_HISTORY:20}
      deployment-state-file: ${AGENT_RAG_ROUTING_DEPLOYMENT_STATE_FILE:tmp/routing-policy/deployment.json}
      # 部署/回滚会改变真实流量，默认只开放只读状态接口。
      management-api-enabled: ${AGENT_RAG_ROUTING_MANAGEMENT_API_ENABLED:false}
      minimum-samples-per-mode: ${AGENT_RAG_ROUTING_MINIMUM_SAMPLES_PER_MODE:8}
      maximum-trajectories: ${AGENT_RAG_ROUTING_MAXIMUM_TRAJECTORIES:500}
      minimum-utility-lift: ${AGENT_RAG_ROUTING_MINIMUM_UTILITY_LIFT:0.03}
      success-reward-threshold: ${AGENT_RAG_ROUTING_SUCCESS_REWARD_THRESHOLD:0.72}
      cost-weight: ${AGENT_RAG_ROUTING_COST_WEIGHT:0.05}
      latency-weight: ${AGENT_RAG_ROUTING_LATENCY_WEIGHT:0.05}
      cost-budget-cny: ${AGENT_RAG_ROUTING_COST_BUDGET_CNY:0.02}
      latency-budget-ms: ${AGENT_RAG_ROUTING_LATENCY_BUDGET_MS:60000}
      refresh-seconds: ${AGENT_RAG_ROUTING_REFRESH_SECONDS:30}
      quality-guard:
        enabled: ${AGENT_RAG_ROUTING_QUALITY_GUARD_ENABLED:true}
        evaluation-interval-ms: ${AGENT_RAG_ROUTING_GUARD_INTERVAL_MS:30000}
        minimum-control-samples: ${AGENT_RAG_ROUTING_GUARD_MINIMUM_CONTROL_SAMPLES:20}
        maximum-trajectories: ${AGENT_RAG_ROUTING_GUARD_MAXIMUM_TRAJECTORIES:1000}
        maximum-reward-regression: ${AGENT_RAG_ROUTING_GUARD_MAXIMUM_REWARD_REGRESSION:0.05}
        maximum-grounding-regression: ${AGENT_RAG_ROUTING_GUARD_MAXIMUM_GROUNDING_REGRESSION:0.05}
        maximum-completion-regression: ${AGENT_RAG_ROUTING_GUARD_MAXIMUM_COMPLETION_REGRESSION:0.05}
        maximum-latency-multiplier: ${AGENT_RAG_ROUTING_GUARD_MAXIMUM_LATENCY_MULTIPLIER:1.5}
        maximum-cost-multiplier: ${AGENT_RAG_ROUTING_GUARD_MAXIMUM_COST_MULTIPLIER:1.5}
      registry:
        state-file: ${AGENT_RAG_ROUTING_REGISTRY_STATE_FILE:tmp/routing-policy/registry.json}
        algorithm: ${AGENT_RAG_ROUTING_REGISTRY_ALGORITHM:trajectory-utility-contextual-policy-v3}
        maximum-artifacts: ${AGENT_RAG_ROUTING_REGISTRY_MAXIMUM_ARTIFACTS:50}
        reconcile-interval-ms: ${AGENT_RAG_ROUTING_REGISTRY_RECONCILE_INTERVAL_MS:60000}
      temporal-holdout:
        # 只用较早轨迹训练，较新的时间窗口仅用于独立发布验证。
        validation-ratio: ${AGENT_RAG_ROUTING_HOLDOUT_VALIDATION_RATIO:0.25}
        minimum-samples-per-mode: ${AGENT_RAG_ROUTING_HOLDOUT_MINIMUM_SAMPLES_PER_MODE:4}
        minimum-utility-lift-lower-bound: ${AGENT_RAG_ROUTING_HOLDOUT_MINIMUM_LIFT_LCB:0.0}
      progressive-delivery:
        # 默认只输出发布建议。自动发布需要 DRY RUN、主开关和持久化控制三道门同时放行。
        enabled: ${AGENT_RAG_ROUTING_PROGRESSIVE_ENABLED:true}
        dry-run: ${AGENT_RAG_ROUTING_PROGRESSIVE_DRY_RUN:true}
        canary-stages: ${AGENT_RAG_ROUTING_PROGRESSIVE_STAGES:0.05,0.10,0.25,0.50}
        cooldown-minutes: ${AGENT_RAG_ROUTING_PROGRESSIVE_COOLDOWN_MINUTES:30}
        auto-apply-enabled: ${AGENT_RAG_ROUTING_PROGRESSIVE_AUTO_APPLY_ENABLED:false}
        automation-enabled-by-default: ${AGENT_RAG_ROUTING_PROGRESSIVE_AUTOMATION_DEFAULT:false}
        emergency-stop: ${AGENT_RAG_ROUTING_PROGRESSIVE_EMERGENCY_STOP:false}
        automation-state-file: ${AGENT_RAG_ROUTING_PROGRESSIVE_STATE_FILE:tmp/routing-policy/progressive-delivery.json}
        evaluation-interval-ms: ${AGENT_RAG_ROUTING_PROGRESSIVE_INTERVAL_MS:60000}
        maximum-audit-history: ${AGENT_RAG_ROUTING_PROGRESSIVE_MAX_AUDIT_HISTORY:100}
      off-policy:
        minimum-samples-per-action: ${AGENT_RAG_ROUTING_OPE_MINIMUM_SAMPLES_PER_ACTION:20}
        minimum-effective-sample-size: ${AGENT_RAG_ROUTING_OPE_MINIMUM_EFFECTIVE_SAMPLE_SIZE:20}
        maximum-importance-weight: ${AGENT_RAG_ROUTING_OPE_MAXIMUM_IMPORTANCE_WEIGHT:20}
        maximum-reward-regression: ${AGENT_RAG_ROUTING_OPE_MAXIMUM_REWARD_REGRESSION:0.03}
      drift-monitor:
        enabled: ${AGENT_RAG_ROUTING_DRIFT_ENABLED:true}
        evaluation-interval-ms: ${AGENT_RAG_ROUTING_DRIFT_INTERVAL_MS:60000}
        minimum-reference-samples: ${AGENT_RAG_ROUTING_DRIFT_MINIMUM_REFERENCE_SAMPLES:20}
        minimum-active-samples: ${AGENT_RAG_ROUTING_DRIFT_MINIMUM_ACTIVE_SAMPLES:30}
        maximum-samples-per-window: ${AGENT_RAG_ROUTING_DRIFT_MAXIMUM_SAMPLES_PER_WINDOW:500}
        consecutive-violations: ${AGENT_RAG_ROUTING_DRIFT_CONSECUTIVE_VIOLATIONS:3}
        maximum-feature-js-divergence: ${AGENT_RAG_ROUTING_DRIFT_MAXIMUM_FEATURE_JS_DIVERGENCE:0.20}
        maximum-reward-regression: ${AGENT_RAG_ROUTING_DRIFT_MAXIMUM_REWARD_REGRESSION:0.05}
        maximum-grounding-regression: ${AGENT_RAG_ROUTING_DRIFT_MAXIMUM_GROUNDING_REGRESSION:0.05}
        maximum-completion-regression: ${AGENT_RAG_ROUTING_DRIFT_MAXIMUM_COMPLETION_REGRESSION:0.05}
        maximum-latency-multiplier: ${AGENT_RAG_ROUTING_DRIFT_MAXIMUM_LATENCY_MULTIPLIER:1.5}
        maximum-cost-multiplier: ${AGENT_RAG_ROUTING_DRIFT_MAXIMUM_COST_MULTIPLIER:1.5}
    observability:
      # Agent 阶段级硬超时，覆盖底层客户端重试/握手卡住的情况。
      model-call-timeout-seconds: ${AGENT_RAG_MODEL_CALL_TIMEOUT_SECONDS:60}
      # 默认按 qwen-turbo 中国内地公开价估算；可通过环境变量覆盖。
      input-price-per-million-tokens-cny: ${AGENT_RAG_INPUT_PRICE_PER_MILLION_TOKENS_CNY:0.3}
      output-price-per-million-tokens-cny: ${AGENT_RAG_OUTPUT_PRICE_PER_MILLION_TOKENS_CNY:0.6}
  rl:
    policy-version: ${AGENT_RL_POLICY_VERSION:agentic-rag-v13}
    storage-directory: ${AGENT_RL_STORAGE_DIRECTORY:tmp/agent-rl/trajectories}
    # 轨迹包含用户问题和答案；仅在受信任环境中显式开启管理 API。
    api-enabled: ${AGENT_RL_API_ENABLED:false}
    bailian:
      export-directory: ${AGENT_RL_BAILIAN_EXPORT_DIRECTORY:tmp/agent-rl/bailian}
      minimum-reward: ${AGENT_RL_BAILIAN_MINIMUM_REWARD:0.7}
      validation-ratio: ${AGENT_RL_BAILIAN_VALIDATION_RATIO:0.2}
      expected-batch-size: ${AGENT_RL_BAILIAN_EXPECTED_BATCH_SIZE:64}
      # HUMAN_ONLY 可退回旧的人审模式；默认使用 RLVR + 多 AI Judge 自动审批。
      approval-mode: ${AGENT_RL_BAILIAN_APPROVAL_MODE:AUTOMATED_ALIGNMENT}
      # 三组训练数据必须真实不同：纯 RLVR、AI Judge 筛选、奖励轨迹筛选。
      dataset-profile: ${AGENT_RL_BAILIAN_DATASET_PROFILE:FULL_TRAJECTORY_GUIDED}
      trajectory-selection:
        minimum-rounds: ${AGENT_RL_BAILIAN_TRAJECTORY_MINIMUM_ROUNDS:2}
        top-ratio: ${AGENT_RL_BAILIAN_TRAJECTORY_TOP_RATIO:0.3}
        similarity-threshold: ${AGENT_RL_BAILIAN_TRAJECTORY_SIMILARITY_THRESHOLD:0.8}
        minimum-confidence: ${AGENT_RL_BAILIAN_TRAJECTORY_MINIMUM_CONFIDENCE:0.72}
    alignment:
      storage-directory: ${AGENT_RL_ALIGNMENT_STORAGE_DIRECTORY:tmp/agent-rl/alignment-assessments}
      minimum-judge-count: ${AGENT_RL_ALIGNMENT_MINIMUM_JUDGE_COUNT:4}
      minimum-agreement: ${AGENT_RL_ALIGNMENT_MINIMUM_AGREEMENT:0.7}
      minimum-confidence: ${AGENT_RL_ALIGNMENT_MINIMUM_CONFIDENCE:0.72}
      positive-reward-threshold: ${AGENT_RL_ALIGNMENT_POSITIVE_REWARD_THRESHOLD:0.75}
      negative-reward-threshold: ${AGENT_RL_ALIGNMENT_NEGATIVE_REWARD_THRESHOLD:0.35}
      minimum-grounding-reward: ${AGENT_RL_ALIGNMENT_MINIMUM_GROUNDING_REWARD:0.7}
      # 自动评审会产生模型调用费用，只有显式开启后才定时处理新轨迹。
      auto-evaluate-enabled: ${AGENT_RL_ALIGNMENT_AUTO_EVALUATE_ENABLED:false}
      auto-evaluate-batch-size: ${AGENT_RL_ALIGNMENT_AUTO_EVALUATE_BATCH_SIZE:10}
      auto-evaluate-interval-ms: ${AGENT_RL_ALIGNMENT_AUTO_EVALUATE_INTERVAL_MS:300000}
      auto-evaluate-initial-delay-ms: ${AGENT_RL_ALIGNMENT_AUTO_EVALUATE_INITIAL_DELAY_MS:60000}
      # 所有批量评分共享每日轨迹额度；连续全批失败后进入持久化冷却，防止费用失控。
      daily-trajectory-limit: ${AGENT_RL_ALIGNMENT_DAILY_TRAJECTORY_LIMIT:50}
      failure-threshold: ${AGENT_RL_ALIGNMENT_FAILURE_THRESHOLD:3}
      failure-cooldown-minutes: ${AGENT_RL_ALIGNMENT_FAILURE_COOLDOWN_MINUTES:30}
      automation-state-file: ${AGENT_RL_ALIGNMENT_AUTOMATION_STATE_FILE:tmp/agent-rl/alignment-automation.json}
      experiment-directory: ${AGENT_RL_ALIGNMENT_EXPERIMENT_DIRECTORY:tmp/evaluation/alignment-experiments}
      ablation:
        maximum-quality-regression: ${AGENT_RL_ALIGNMENT_ABLATION_MAXIMUM_QUALITY_REGRESSION:0.02}
        maximum-cost-ratio: ${AGENT_RL_ALIGNMENT_ABLATION_MAXIMUM_COST_RATIO:1.25}
        # 同一 benchmark 按 caseId 配对；固定种子 Bootstrap 保证报告可复现。
        bootstrap-iterations: ${AGENT_RL_ALIGNMENT_ABLATION_BOOTSTRAP_ITERATIONS:10000}
        confidence-level: ${AGENT_RL_ALIGNMENT_ABLATION_CONFIDENCE_LEVEL:0.95}
        minimum-paired-cases: ${AGENT_RL_ALIGNMENT_ABLATION_MINIMUM_PAIRED_CASES:30}
        paired-win-delta: ${AGENT_RL_ALIGNMENT_ABLATION_PAIRED_WIN_DELTA:0.03}
    environment:
      # 供百炼云端 Rollout 调用；必须部署到云端可访问地址，并配置独立强令牌。
      api-enabled: ${AGENT_RL_ENVIRONMENT_API_ENABLED:false}
      token: ${AGENT_RL_ENVIRONMENT_TOKEN:}
  evaluation:
    # A/B 评测会调用两套 RAG 并产生模型费用，仅在本地受信任环境显式开启。
    api-enabled: ${AGENT_EVALUATION_API_ENABLED:false}
    benchmark: ${AGENT_EVALUATION_BENCHMARK:classpath:evaluation/love-rag-ab.jsonl}
    report-directory: ${AGENT_EVALUATION_REPORT_DIRECTORY:tmp/evaluation}
    maximum-cases: ${AGENT_EVALUATION_MAXIMUM_CASES:100}
    minimum-benchmark-cases: ${AGENT_EVALUATION_MINIMUM_BENCHMARK_CASES:30}
    candidate-minimum-score: ${AGENT_EVALUATION_CANDIDATE_MINIMUM_SCORE:0.72}
    maximum-quality-regression: ${AGENT_EVALUATION_MAXIMUM_QUALITY_REGRESSION:0.02}
    minimum-route-accuracy: ${AGENT_EVALUATION_MINIMUM_ROUTE_ACCURACY:0.8}
    maximum-adaptive-oracle-cost-ratio: ${AGENT_EVALUATION_MAXIMUM_ADAPTIVE_ORACLE_COST_RATIO:1.10}
    # 四臂实验只接受可验证的 64 位 SHA-256 资产/训练指纹；普通本地 smoke 可保持 UNSPECIFIED。
    model-version: ${AGENT_EVALUATION_MODEL_VERSION:qwen-plus}
    model-artifact-fingerprint: ${AGENT_EVALUATION_MODEL_ARTIFACT_FINGERPRINT:UNSPECIFIED}
    training-config-fingerprint: ${AGENT_EVALUATION_TRAINING_CONFIG_FINGERPRINT:UNSPECIFIED}
    reward-schema-version: ${AGENT_EVALUATION_REWARD_SCHEMA_VERSION:human-light-rlvr-v3}
    source-deployment: ${AGENT_EVALUATION_SOURCE_DEPLOYMENT:local}
